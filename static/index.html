<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Fire Tracker</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #globeViz { width: 100vw; height: 100vh; }
  #status {
    position: absolute; top: 16px; left: 16px; z-index: 10;
    background: rgba(20,20,20,0.85); color: #eee; padding: 10px 16px;
    border-radius: 8px; font-size: 13px;
  }
  #optimizePanel {
    position: absolute; top: 16px; right: 16px; z-index: 10;
    background: rgba(20,20,20,0.85); color: #eee; padding: 10px 14px;
    border-radius: 8px; font-size: 13px; display: flex; flex-direction: column; gap: 8px;
  }
  #optimizePanel .switchRow { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background-color: #555; transition: 0.2s; border-radius: 22px;
  }
  .slider::before {
    content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px;
    background-color: #fff; transition: 0.2s; border-radius: 50%;
  }
  input:checked + .slider { background-color: #2ecc71; }
  input:checked + .slider::before { transform: translateX(18px); }

  .sliderRow { display: flex; flex-direction: column; gap: 6px; }
  .sliderRow .rowTop { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .rangeSlider {
    -webkit-appearance: none; appearance: none; width: 140px; height: 4px;
    background: #555; border-radius: 2px; outline: none; margin: 0;
  }
  .rangeSlider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: #e25822; cursor: pointer;
  }
  .rangeSlider::-moz-range-thumb {
    width: 14px; height: 14px; border: none; border-radius: 50%; background: #e25822; cursor: pointer;
  }
  .rangeSlider:disabled { opacity: 0.4; cursor: not-allowed; }
  .rangeSlider:disabled::-webkit-slider-thumb { cursor: not-allowed; }

  #continentPanel {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%); z-index: 10;
    background: rgba(20,20,20,0.85); color: #eee; padding: 12px 14px;
    border-radius: 8px; font-size: 13px; display: flex; flex-direction: column; gap: 6px;
  }
  #continentPanel h2 { font-size: 11px; margin: 0 0 4px; text-transform: uppercase; letter-spacing: 0.05em; color: #999; }
  #continentPanel button {
    background: #2a2a2a; color: #eee; border: none; border-radius: 6px;
    padding: 7px 12px; text-align: left; font-size: 13px; cursor: pointer;
  }
  #continentPanel button:hover { background: #e25822; }

  #continentPanel hr { width: 100%; border: none; border-top: 1px solid #444; margin: 4px 0; }
  #countrySearch {
    background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 6px;
    padding: 7px 10px; font-size: 13px; outline: none;
  }
  #countrySearch:focus { border-color: #e25822; }
  #countryResults { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
  #countryResults button {
    background: #2a2a2a; color: #eee; border: none; border-radius: 6px;
    padding: 6px 12px; text-align: left; font-size: 13px; cursor: pointer;
  }
  #countryResults button:hover { background: #e25822; }

  #predictionPanel {
    position: absolute; bottom: 16px; left: 16px; z-index: 10;
    background: rgba(20,20,20,0.9); color: #eee; padding: 12px 16px;
    border-radius: 8px; font-size: 13px; max-width: 320px; display: none;
  }
  #predictionPanel h3 { margin: 0 0 6px; font-size: 13px; color: #ff8a3d; }
  #predictionPanel p { margin: 3px 0; color: #ccc; }
  #predictionPanel button {
    margin-top: 8px; background: #2a2a2a; color: #eee; border: none;
    border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  #predictionPanel button:hover { background: #555; }

  #windToggleBtn {
    position: absolute; bottom: 24px; right: 24px; z-index: 1000;
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(20,20,20,0.85); color: #eee; border: 2px solid #444;
    font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  #windToggleBtn:hover { border-color: #e25822; }
  #windToggleBtn.active { background: #1a5276; border-color: #66ccff; }
</style>
</head>
<body>
<div id="status">Loading fire data...</div>
<div id="optimizePanel">
  <div class="switchRow">
    <span>Optimize</span>
    <label class="switch">
      <input type="checkbox" id="optimizeToggle" />
      <span class="slider"></span>
    </label>
  </div>
  <div class="switchRow">
    <span>Prediction</span>
    <label class="switch">
      <input type="checkbox" id="predictionToggle" checked />
      <span class="slider"></span>
    </label>
  </div>
  <div class="sliderRow">
    <div class="rowTop">
      <span>Prediction range</span>
      <span id="predictionDaysLabel">1 day</span>
    </div>
    <input type="range" class="rangeSlider" id="predictionDaysSlider" min="1" max="7" step="1" value="1" />
  </div>
  <div class="sliderRow">
    <div class="rowTop">
      <span>Fires shown</span>
      <span id="fireCountLabel">2.5k</span>
    </div>
    <input type="range" class="rangeSlider" id="fireCountSlider" min="0" max="6" step="1" value="0" />
  </div>
</div>
<div id="continentPanel">
  <h2>Quick Look</h2>
  <button data-lat="1" data-lng="21" data-alt="1.8">Africa</button>
  <button data-lat="-82" data-lng="0" data-alt="1.8">Antarctica</button>
  <button data-lat="34" data-lng="100" data-alt="1.8">Asia</button>
  <button data-lat="-25" data-lng="133" data-alt="1.8">Australia</button>
  <button data-lat="54" data-lng="15" data-alt="1.8">Europe</button>
  <button data-lat="45" data-lng="-100" data-alt="1.8">North America</button>
  <button data-lat="-15" data-lng="-60" data-alt="1.8">South America</button>
  <hr />
  <input type="text" id="countrySearch" placeholder="Search country..." autocomplete="off" />
  <div id="countryResults"></div>
</div>
<div id="predictionPanel">
  <h3>Fire spread predictions</h3>
  <div id="predictionInfo"></div>
  <button id="clearPredictions">Clear</button>
</div>
<button id="windToggleBtn" title="Toggle wind direction overlay">🧭</button>
<div id="globeViz"></div>

<script src="https://unpkg.com/globe.gl"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<script>
const statusEl = document.getElementById('status');
const optimizeToggle = document.getElementById('optimizeToggle');

// Builds a single lightweight flat-color texture for "Optimize" mode:
// land is shaded green (darker toward higher elevation/mountains), ocean is blue.
// Uses a real land/ocean mask + elevation heightmap, downsampled once and
// recolored on a canvas, so at render time it's just one small static texture
// with no bump displacement, atmosphere, or starfield background.
function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

async function buildSimpleTexture() {
  const W = 512, H = 256;

  const [waterImg, elevImg] = await Promise.all([
    loadImage('https://unpkg.com/three-globe/example/img/earth-water.png'),
    loadImage('https://unpkg.com/three-globe/example/img/earth-topology.png'),
  ]);

  const wCanvas = document.createElement('canvas');
  wCanvas.width = W; wCanvas.height = H;
  const wCtx = wCanvas.getContext('2d');
  wCtx.drawImage(waterImg, 0, 0, W, H);
  const waterData = wCtx.getImageData(0, 0, W, H).data;

  const eCanvas = document.createElement('canvas');
  eCanvas.width = W; eCanvas.height = H;
  const eCtx = eCanvas.getContext('2d');
  eCtx.drawImage(elevImg, 0, 0, W, H);
  const elevData = eCtx.getImageData(0, 0, W, H).data;

  // Normalize elevation using only land pixels (ocean elevation values are
  // clamped near 0 and would otherwise skew the range).
  const landElevs = [];
  for (let i = 0; i < W * H; i++) {
    if (waterData[i * 4] < 180) landElevs.push(elevData[i * 4]);
  }
  landElevs.sort((a, b) => a - b);
  const lo = landElevs[Math.floor(landElevs.length * 0.05)] || 0;
  const hi = landElevs[Math.floor(landElevs.length * 0.95)] || 255;

  const out = wCtx.createImageData(W, H);
  for (let i = 0; i < W * H; i++) {
    const idx = i * 4;
    const isOcean = waterData[idx] >= 180;
    if (isOcean) {
      // gentle vertical gradient: brighter blue near the equator, darker toward poles
      const y = Math.floor(i / W);
      const t = Math.abs(y - H / 2) / (H / 2);
      out.data[idx] = lerp(20, 8, t);
      out.data[idx + 1] = lerp(90, 45, t);
      out.data[idx + 2] = lerp(160, 95, t);
    } else {
      const t = clamp((elevData[idx] - lo) / ((hi - lo) || 1), 0, 1);
      // low elevation -> bright lowland green, high elevation -> dark mountain green
      out.data[idx] = lerp(55, 95, t);
      out.data[idx + 1] = lerp(145, 75, t);
      out.data[idx + 2] = lerp(60, 55, t);
    }
    out.data[idx + 3] = 255;
  }
  wCtx.putImageData(out, 0, 0);
  return wCanvas.toDataURL();
}

let simpleTexturePromise = null;
function getSimpleTexture() {
  if (!simpleTexturePromise) simpleTexturePromise = buildSimpleTexture();
  return simpleTexturePromise;
}

// Fire severity scale: log-normalized so a handful of very intense fires
// (or clusters) don't wash out everything else at max marker size.
const FRP_SCALE_REF = 150; // MW - combined FRP that reads as "maximum severity"
function intensityT(frp) {
  return clamp(Math.log1p(frp) / Math.log1p(FRP_SCALE_REF), 0, 1);
}

function fireTooltip(d) {
  if (d.predicted) {
    const label = d.count > 1 ? `${d.count} fires, combined FRP ${d.totalFrp.toFixed(1)} MW` : `FRP: ${d.totalFrp.toFixed(1)} MW`;
    return `Projected ${d.predictionHours}hr position<br/>${label}<br/>Wind: ${d.windSpeedKmh.toFixed(1)} km/h`;
  }
  if (d.count > 1) {
    return `${d.count} fires clustered here<br/>Combined FRP: ${d.totalFrp.toFixed(1)} MW<br/>Most intense: ${d.maxFrp.toFixed(1)} MW`;
  }
  const f = d.fires[0];
  return `FRP: ${f.frp} MW<br/>Confidence: ${f.confidence}<br/>${f.acq_date} ${f.acq_time}`;
}

// Severity color: yellow (light) -> orange (middle) -> red (bad).
const SEVERITY_YELLOW = [255, 221, 51];
const SEVERITY_ORANGE = [255, 140, 20];
const SEVERITY_RED = [200, 30, 20];
function severityColor(t) {
  const [c1, c2, u] = t < 0.5 ? [SEVERITY_YELLOW, SEVERITY_ORANGE, t * 2] : [SEVERITY_ORANGE, SEVERITY_RED, (t - 0.5) * 2];
  const r = lerp(c1[0], c2[0], u) | 0;
  const g = lerp(c1[1], c2[1], u) | 0;
  const b = lerp(c1[2], c2[2], u) | 0;
  return `rgb(${r},${g},${b})`;
}

// Dimmed version of a severity color, used for a fire's old position once a
// 24hr prediction has been run for it (the new predicted position gets the
// normal, full-brightness marker instead).
function fadeColor(rgbString) {
  const [r, g, b] = rgbString.match(/\d+/g).map(Number);
  const DARK = 40;
  return `rgb(${lerp(r, DARK, 0.75) | 0},${lerp(g, DARK, 0.75) | 0},${lerp(b, DARK, 0.75) | 0})`;
}

const world = Globe()
  (document.getElementById('globeViz'))
  .pointOfView({ lat: 20, lng: 0, altitude: 2.2 })
  // Plain WebGL points, not HTML/DOM elements: three-globe repositions every
  // marker's screen transform on every animation frame as the camera moves,
  // and doing that for thousands of live DOM nodes (each also paying a
  // box-shadow blur repaint) was the real cause of the lag - WebGL points
  // render in one batched GPU draw call regardless of count.
  .pointAltitude(0.004)
  .pointRadius(d => lerp(0.04, 0.14, intensityT(d.totalFrp)))
  .pointColor(d => (d.faded ? fadeColor(severityColor(intensityT(d.totalFrp))) : severityColor(intensityT(d.totalFrp))))
  .pointLabel(fireTooltip)
  .polygonCapColor(() => 'rgba(0,0,0,0)')
  .polygonSideColor(() => 'rgba(0,0,0,0)')
  .polygonStrokeColor(() => '#000000')
  .polygonAltitude(0.005)
  .polygonLabel(d => d.properties?.name ?? '')
  .labelsData([])
  .labelLat(d => d.lat)
  .labelLng(d => d.lng)
  .labelText(d => d.text)
  .labelRotation(d => d.rot)
  .labelLabel(d => d.tooltip ?? '')
  .labelSize(d => d.size)
  .labelColor(d => d.color)
  .labelDotRadius(0)
  .labelIncludeDot(false)
  .labelResolution(3)
  .labelAltitude(0.006)
  .labelsTransitionDuration(0);

// Groups fires within gridDeg of each other into a single marker, purely to
// reduce visual clutter - the underlying detections are kept (in `.fires`)
// rather than discarded, so nothing about the data is lost, only how
// densely-packed detections are displayed. The grid size scales with camera
// altitude (see gridForAltitude): coarse/few clusters at whole-earth zoom
// where thousands of individual points would be both unreadable and slow to
// render, fine-grained detail once zoomed into a region - the same
// zoom-dependent level-of-detail technique 2D map tools use to stay fast.
function gridForAltitude(altitude) {
  if (altitude > 1.2) return 2.0; // whole-earth view - a handful of regional blobs
  if (altitude > 0.6) return 0.5;
  if (altitude > 0.2) return 0.15;
  return 0.05; // zoomed into a country - full detail (~5.5km)
}

function clusterFires(fires, gridDeg) {
  const groups = new Map();
  fires.forEach(f => {
    const key = `${Math.round(f.lat / gridDeg)},${Math.round(f.lng / gridDeg)}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(f);
  });

  return [...groups.values()].map(group => {
    const totalFrp = group.reduce((sum, f) => sum + f.frp, 0);
    const maxFrp = Math.max(...group.map(f => f.frp));
    // FRP-weighted centroid, so the marker sits nearer the most intense
    // detections rather than a plain geographic average.
    const weight = totalFrp || group.length;
    const lat = group.reduce((sum, f) => sum + f.lat * (f.frp || 1), 0) / weight;
    const lng = group.reduce((sum, f) => sum + f.lng * (f.frp || 1), 0) / weight;
    return { lat, lng, count: group.length, totalFrp, maxFrp, fires: group };
  });
}

// The labels layer holds two things merged together: an arrowhead on each
// predicted fire's ORIGINAL position pointing toward where it's headed (only
// while Prediction is on and a country was searched, capped at
// MAX_PREDICTIONS), and the wind direction overlay (toggled independently
// via the compass button). Fire markers used to also add a "!" text label
// per cluster, but each glyph is a real 3D TextGeometry, not a cheap point
// sprite - in a dense fire complex that meant hundreds of text geometries
// being (re)built at once, which was the actual cause of the zoom-in lag.
// Both layers here stay small (one glyph per prediction/grid cell, not per
// raw fire) so they don't reintroduce that cost.
let arrowheads = [];
let windOverlayArrows = [];
function updateLabelsLayer() {
  world.labelsData([...arrowheads, ...windOverlayArrows]);
}

let lastRenderedFires = [];
let lastClusters = [];

function renderFireMarkers(fires, altitudeOverride) {
  lastRenderedFires = fires;
  // world.pointOfView().altitude reflects the camera's CURRENT position,
  // which mid-flyTo is some in-between value, not the destination - reading
  // it right after a country search (before the 1s flight finishes) picked
  // the wrong cluster grid size and threw off cluster centroids. Callers
  // that know the real target altitude (e.g. a just-searched country) pass
  // it explicitly instead of relying on a live camera read.
  const altitude = altitudeOverride ?? world.pointOfView().altitude;
  const gridDeg = gridForAltitude(altitude);
  currentZoomTier = gridDeg;
  lastClusters = clusterFires(fires, gridDeg);
  world.pointsData(lastClusters);
  // Re-clustering invalidates any faded/predicted markers from a previous
  // prediction run (they were tied to the old cluster positions), so clear
  // them rather than leave a stale, misaligned prediction on screen.
  clearPredictions();
}

// Re-cluster (not re-fetch) whenever the camera crosses into a different
// zoom tier, so the marker count adapts to what's actually legible/fast at
// the current view without hitting the network again.
let currentZoomTier = null;
world.controls().addEventListener('change', () => {
  if (lastRenderedFires.length === 0) return;
  const tier = gridForAltitude(world.pointOfView().altitude);
  if (tier === currentZoomTier) return;
  currentZoomTier = tier;
  renderFireMarkers(lastRenderedFires);
});

// Approximate polygon area (shoelace formula on raw lon/lat) - only used to
// rank ring sizes, not for precise measurement.
function ringArea(ring) {
  let area = 0;
  for (let i = 0; i < ring.length; i++) {
    const [x1, y1] = ring[i];
    const [x2, y2] = ring[(i + 1) % ring.length];
    area += x1 * y2 - x2 * y1;
  }
  return Math.abs(area / 2);
}

// Bounding-box center/extent of a country's MAIN landmass, used to fly the
// camera to it. Countries with far-flung territories (e.g. France with
// French Guiana, the Netherlands, the UK) are MultiPolygons - averaging
// across every part would land the camera in open ocean between them, so
// we only use the largest polygon by area.
function boundsOf(feature) {
  const geom = feature.geometry;
  const polygons = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;

  let mainPolygon = polygons[0];
  let bestArea = ringArea(polygons[0][0]);
  for (let i = 1; i < polygons.length; i++) {
    const a = ringArea(polygons[i][0]);
    if (a > bestArea) { bestArea = a; mainPolygon = polygons[i]; }
  }

  let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
  mainPolygon[0].forEach(([lng, lat]) => {
    if (lat < minLat) minLat = lat;
    if (lat > maxLat) maxLat = lat;
    if (lng < minLng) minLng = lng;
    if (lng > maxLng) maxLng = lng;
  });
  return {
    lat: (minLat + maxLat) / 2,
    lng: (minLng + maxLng) / 2,
    latSpan: maxLat - minLat,
    lngSpan: maxLng - minLng,
    minLat, maxLat, minLng, maxLng,
  };
}

// Standard even-odd ray-casting point-in-polygon test. `ring` is a GeoJSON
// coordinate ring, [[lng,lat], ...].
function pointInRing(lat, lng, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i];
    const [xj, yj] = ring[j];
    const intersects = yi > lat !== yj > lat && lng < ((xj - xi) * (lat - yi)) / (yj - yi) + xi;
    if (intersects) inside = !inside;
  }
  return inside;
}

// Whether (lat, lng) falls inside a country's actual GeoJSON shape (Polygon
// or MultiPolygon, respecting holes) - not just its bounding box. A
// bounding-box fetch alone lets fires from neighboring countries through
// (e.g. France's rectangle overlaps parts of Switzerland/Germany/Italy);
// this is the precise filter applied on top of that fetch.
function pointInCountryGeometry(lat, lng, geometry) {
  const polygons = geometry.type === 'Polygon' ? [geometry.coordinates] : geometry.coordinates;
  for (const polygon of polygons) {
    if (!pointInRing(lat, lng, polygon[0])) continue;
    let inHole = false;
    for (let h = 1; h < polygon.length; h++) {
      if (pointInRing(lat, lng, polygon[h])) { inHole = true; break; }
    }
    if (!inHole) return true;
  }
  return false;
}

let COUNTRY_LIST = [];
const countrySearch = document.getElementById('countrySearch');
const countryResults = document.getElementById('countryResults');

async function loadCountryBorders() {
  const topo = await (await fetch('https://unpkg.com/world-atlas@2/countries-110m.json')).json();
  const countries = topojson.feature(topo, topo.objects.countries).features
    .filter(f => f.properties?.name && f.properties.name !== 'Antarctica');
  world.polygonsData(countries);

  COUNTRY_LIST = countries.map(f => {
    const b = boundsOf(f);
    // pad the bbox a bit so fires just across a border/coastline aren't missed
    // by the initial fetch - the precise polygon filter below still excludes
    // them from the final result if they're genuinely outside the country.
    const pad = 0.75;
    return {
      name: f.properties.name,
      lat: b.lat,
      lng: b.lng,
      altitude: clamp(Math.max(b.latSpan, b.lngSpan) / 60, 0.25, 2.2),
      minLat: clamp(b.minLat - pad, -90, 90),
      maxLat: clamp(b.maxLat + pad, -90, 90),
      minLng: clamp(b.minLng - pad, -180, 180),
      maxLng: clamp(b.maxLng + pad, -180, 180),
      geometry: f.geometry,
    };
  });
}
loadCountryBorders();

function renderCountryResults(query) {
  countryResults.innerHTML = '';
  if (!query) return;
  const q = query.toLowerCase();
  COUNTRY_LIST
    .filter(c => c.name.toLowerCase().startsWith(q))
    .sort((a, b) => a.name.localeCompare(b.name))
    .forEach(c => {
      const btn = document.createElement('button');
      btn.textContent = c.name;
      btn.addEventListener('click', async () => {
        world.pointOfView({ lat: c.lat, lng: c.lng, altitude: c.altitude }, 1000);
        const fires = await loadCountryFires(c);
        if (predictionToggle.checked) {
          runCountryPredictions(c, fires);
        }
      });
      countryResults.appendChild(btn);
    });
}

countrySearch.addEventListener('input', () => {
  const query = countrySearch.value.trim();
  renderCountryResults(query);
  if (!query) {
    // Back to the current world-wide "Fires shown" setting rather than
    // staying stuck on whatever country was last searched.
    lastPredictedCountry = null;
    lastPredictedFires = null;
    loadFires();
  }
});

// --- Fire spread predictions: projected location N days out (gated by the Prediction toggle, run on country search) ---
const predictionToggle = document.getElementById('predictionToggle');
const predictionPanel = document.getElementById('predictionPanel');
const predictionInfo = document.getElementById('predictionInfo');
const clearPredictionsBtn = document.getElementById('clearPredictions');
const predictionDaysSlider = document.getElementById('predictionDaysSlider');
const predictionDaysLabel = document.getElementById('predictionDaysLabel');
const MAX_PREDICTIONS = 150; // safety cap for pathological cases; take the most intense first
const WIND_GRID_DEG = 0.3; // wind is shared across markers within this grid cell (~30km) to limit API calls

function predictionHours() {
  return (+predictionDaysSlider.value) * 24;
}

// Tracks the most recent successful prediction run, so changing the day
// slider can re-run it at the new range instead of just changing a number
// nothing looks at.
let lastPredictedCountry = null;
let lastPredictedFires = null;

predictionDaysSlider.addEventListener('input', () => {
  const days = +predictionDaysSlider.value;
  predictionDaysLabel.textContent = days === 1 ? '1 day' : `${days} days`;
});
predictionDaysSlider.addEventListener('change', () => {
  if (predictionToggle.checked && lastPredictedCountry) {
    runCountryPredictions(lastPredictedCountry, lastPredictedFires);
  }
});

let ALL_FIRES = [];

// Fetches the accurate, full fire set for a country's bbox (the initial world
// view only holds a capped highest-intensity subset - see the fire count
// slider - so smaller/less intense fires in a given country may be missing
// from it). Renders ONLY this country's fires, replacing whatever was shown
// before - merging into the accumulated world dataset used to mean a search
// after "Show all fires" reclustered and predicted on the entire world's
// fires at the country's fine zoom grid (slow, and predictions landed
// wherever the globally most intense fires happened to be, not in the
// searched country).
async function loadCountryFires(country) {
  statusEl.textContent = `Loading fires for ${country.name}...`;
  const bbox = [country.minLng, country.minLat, country.maxLng, country.maxLat].join(',');
  try {
    const res = await fetch('/api/fires?bbox=' + encodeURIComponent(bbox));
    const json = await res.json();
    if (!res.ok) throw new Error(json.detail || 'Failed to load fires');

    // The bbox fetch is a rectangle around the country's shape, so it also
    // pulls in fires from neighboring countries that fall inside that
    // rectangle but outside the country itself - filter against the actual
    // polygon to keep only fires genuinely within its borders.
    const fires = json.fires.filter(f => pointInCountryGeometry(f.lat, f.lng, country.geometry));

    renderFireMarkers(fires, country.altitude);
    statusEl.textContent = `${fires.length} active fire detections in ${country.name}`;
    return fires;
  } catch (err) {
    statusEl.textContent = 'Error loading fires: ' + err.message;
    return [];
  }
}

// Label glyphs point "south" (down-screen) at rotation 0, rotating clockwise
// from there - empirically verified against the compass, not a documented API.
function bearingToLabelRotation(bearingDeg) {
  return (180 - bearingDeg + 360) % 360;
}

// --- Wind direction overlay (toggled via the compass button, independent of predictions) ---
const windToggleBtn = document.getElementById('windToggleBtn');
let windOverlayOn = false;

// A coarse worldwide sample grid, not one arrow per fire - keeps this to a
// couple hundred wind lookups (one batched request) and a couple hundred
// cheap arrow labels regardless of how many fires are loaded.
function buildWindSampleGrid() {
  const points = [];
  for (let lat = -60; lat <= 60; lat += 30) {
    for (let lng = -180; lng < 180; lng += 30) {
      points.push({ lat, lng });
    }
  }
  return points;
}

async function loadWindOverlay() {
  const points = buildWindSampleGrid();
  const res = await fetch('/api/wind/batch', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(points),
  });
  if (!res.ok) return;
  const json = await res.json();
  windOverlayArrows = json.results.map(wind => ({
    lat: wind.lat,
    lng: wind.lng,
    text: '^',
    rot: bearingToLabelRotation(wind.wind_blowing_toward_deg),
    color: '#66ccff',
    size: 0.4,
    tooltip: `Wind: ${wind.wind_speed_kmh.toFixed(1)} km/h`,
  }));
  updateLabelsLayer();
}

windToggleBtn.addEventListener('click', async () => {
  windOverlayOn = !windOverlayOn;
  windToggleBtn.classList.toggle('active', windOverlayOn);
  if (windOverlayOn) {
    await loadWindOverlay();
  } else {
    windOverlayArrows = [];
    updateLabelsLayer();
  }
});

// Great-circle destination point, `distanceKm` from (lat, lng) along
// bearingDeg (0=N, 90=E).
function destinationPoint(lat, lng, bearingDeg, distanceKm) {
  const R = 6371;
  const bearing = (bearingDeg * Math.PI) / 180;
  const lat1 = (lat * Math.PI) / 180;
  const lng1 = (lng * Math.PI) / 180;
  const dR = distanceKm / R;
  const lat2 = Math.asin(Math.sin(lat1) * Math.cos(dR) + Math.cos(lat1) * Math.sin(dR) * Math.cos(bearing));
  const lng2 = lng1 + Math.atan2(
    Math.sin(bearing) * Math.sin(dR) * Math.cos(lat1),
    Math.cos(dR) - Math.sin(lat1) * Math.sin(lat2)
  );
  return { lat: (lat2 * 180) / Math.PI, lng: (((lng2 * 180) / Math.PI + 540) % 360) - 180 };
}

// Simplified heuristic: spread distance scales with wind speed and fire
// intensity (FRP), projected over the chosen number of hours. Not a
// physical simulation - a demo-grade approximation.
function spreadDistanceKm(windSpeedKmh, frp, hours) {
  const intensityFactor = Math.min(2.0, 0.5 + Math.log1p(frp) / 5);
  return (0.15 * windSpeedKmh + 0.3) * intensityFactor * (hours / 6);
}

function clearPredictions() {
  arrowheads = [];
  updateLabelsLayer();
  lastClusters.forEach(c => { c.faded = false; });
  world.pointsData(lastClusters);
  predictionPanel.style.display = 'none';
}

async function runCountryPredictions(country, fires) {
  lastPredictedCountry = country;
  lastPredictedFires = fires;
  const hours = predictionHours();

  clearPredictions();
  predictionPanel.style.display = 'block';

  if (fires.length === 0) {
    predictionInfo.innerHTML = `<p>No active fires detected in ${country.name}.</p>`;
    return;
  }

  // Predict per currently-displayed marker (cluster), not per raw detection -
  // that's what's actually visible on screen, and keeps the prediction count
  // bounded even for a country with hundreds of individual fire detections.
  const targets = lastClusters
    .slice()
    .sort((a, b) => b.totalFrp - a.totalFrp)
    .slice(0, MAX_PREDICTIONS);

  predictionInfo.innerHTML = `<p>Projecting ${hours}hr fire locations for ${targets.length} marker(s) in ${country.name}...</p>`;

  // Wind barely varies over ~30km, so markers are grouped onto a coarse grid
  // and share one wind lookup per cell. All cells are fetched in a single
  // request (Open-Meteo supports comma-separated lat/lng lists natively) -
  // firing one request per cell, even in parallel, was the main source of
  // the slowness for a country with many visible markers.
  const cellOf = c => `${Math.round(c.lat / WIND_GRID_DEG)},${Math.round(c.lng / WIND_GRID_DEG)}`;
  const cellCenters = new Map();
  targets.forEach(c => {
    const key = cellOf(c);
    if (!cellCenters.has(key)) cellCenters.set(key, c);
  });

  const windByCell = new Map();
  const cellEntries = [...cellCenters.entries()];
  if (cellEntries.length > 0) {
    const res = await fetch('/api/wind/batch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cellEntries.map(([, c]) => ({ lat: c.lat, lng: c.lng }))),
    });
    if (res.ok) {
      const json = await res.json();
      json.results.forEach((wind, i) => windByCell.set(cellEntries[i][0], wind));
    }
  }

  const predictedMarkers = [];
  const newArrowheads = [];

  targets.forEach(c => {
    const wind = windByCell.get(cellOf(c));
    if (!wind) return;
    const distanceKm = spreadDistanceKm(wind.wind_speed_kmh, c.totalFrp, hours);
    const dest = destinationPoint(c.lat, c.lng, wind.wind_blowing_toward_deg, distanceKm);

    c.faded = true; // dim the fire's current position in place

    predictedMarkers.push({
      lat: dest.lat,
      lng: dest.lng,
      count: c.count,
      totalFrp: c.totalFrp,
      maxFrp: c.maxFrp,
      fires: c.fires,
      predicted: true,
      predictionHours: hours,
      windSpeedKmh: wind.wind_speed_kmh,
    });
    // Arrowhead sits on the ORIGINAL (now faded) marker, pointing toward
    // where it's headed - simpler than trying to connect the two markers
    // with a line, and reads fine even for a week-long projection.
    newArrowheads.push({
      lat: c.lat,
      lng: c.lng,
      text: '^',
      rot: bearingToLabelRotation(wind.wind_blowing_toward_deg),
      color: '#ffffff',
      size: 0.5,
      tooltip: `Heading toward projected ${hours}hr position<br/>Wind: ${wind.wind_speed_kmh.toFixed(1)} km/h`,
    });
  });

  world.pointsData([...lastClusters, ...predictedMarkers]);
  arrowheads = newArrowheads;
  updateLabelsLayer();

  predictionInfo.innerHTML = `
    <p>${country.name}: ${fires.length} active fire(s) detected</p>
    <p>Projected ${hours}hr position for ${newArrowheads.length} of ${targets.length} marker(s)</p>
  `;
}

clearPredictionsBtn.addEventListener('click', () => {
  lastPredictedCountry = null;
  lastPredictedFires = null;
  clearPredictions();
});

predictionToggle.addEventListener('change', () => {
  if (!predictionToggle.checked) {
    lastPredictedCountry = null;
    lastPredictedFires = null;
    clearPredictions();
  }
});

function applyRealisticMode() {
  world
    .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
    .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
    .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
    .showAtmosphere(true);
}

async function applySimpleMode() {
  world
    .bumpImageUrl(null)
    .backgroundImageUrl(null)
    .showAtmosphere(false);
  const texture = await getSimpleTexture();
  world.globeImageUrl(texture);
}

applyRealisticMode();

optimizeToggle.addEventListener('change', () => {
  if (optimizeToggle.checked) {
    applySimpleMode();
  } else {
    applyRealisticMode();
  }
});

document.querySelectorAll('#continentPanel button').forEach(btn => {
  btn.addEventListener('click', () => {
    world.pointOfView(
      { lat: parseFloat(btn.dataset.lat), lng: parseFloat(btn.dataset.lng), altitude: parseFloat(btn.dataset.alt) },
      1000
    );
  });
});

// Slider steps replace the old all-or-nothing toggle: fast initial paint at
// 2.5k, working up to the full worldwide dataset.
const FIRE_COUNT_STEPS = [2500, 10000, 20000, 30000, 40000, 50000, null]; // null = all
const FIRE_COUNT_LABELS = ['2.5k', '10k', '20k', '30k', '40k', '50k', 'All'];
const fireCountSlider = document.getElementById('fireCountSlider');
const fireCountLabel = document.getElementById('fireCountLabel');

async function loadFires() {
  const limit = FIRE_COUNT_STEPS[+fireCountSlider.value];
  statusEl.textContent = limit ? 'Loading fire data...' : 'Loading all fires worldwide...';
  try {
    const url = limit ? `/api/fires?limit=${limit}` : '/api/fires';
    const res = await fetch(url);
    const json = await res.json();
    if (!res.ok) throw new Error(json.detail || 'Failed to load fires');
    ALL_FIRES = json.fires;
    renderFireMarkers(ALL_FIRES);
    statusEl.textContent = limit
      ? `${json.fires.length} highest-intensity fire detections worldwide (search a country for full detail)`
      : `${json.fires.length} active fire detections worldwide`;
  } catch (err) {
    statusEl.textContent = 'Error loading fires: ' + err.message;
    console.error(err);
  }
}

fireCountSlider.addEventListener('input', () => {
  fireCountLabel.textContent = FIRE_COUNT_LABELS[+fireCountSlider.value];
});
fireCountSlider.addEventListener('change', loadFires);

loadFires();
</script>
