<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Fire Tracker</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #globeViz { width: 100vw; height: 100vh; }
  #status {
    position: absolute; top: 16px; left: 16px; z-index: 10;
    background: rgba(20,20,20,0.85); color: #eee; padding: 10px 16px;
    border-radius: 8px; font-size: 13px;
  }
  #optimizePanel {
    position: absolute; top: 16px; right: 16px; z-index: 10;
    background: rgba(20,20,20,0.85); color: #eee; padding: 10px 14px;
    border-radius: 8px; font-size: 13px; display: flex; flex-direction: column; gap: 8px;
  }
  #optimizePanel .switchRow { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background-color: #555; transition: 0.2s; border-radius: 22px;
  }
  .slider::before {
    content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px;
    background-color: #fff; transition: 0.2s; border-radius: 50%;
  }
  input:checked + .slider { background-color: #2ecc71; }
  input:checked + .slider::before { transform: translateX(18px); }

  .sliderRow { display: flex; flex-direction: column; gap: 6px; }
  .sliderRow .rowTop { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .rangeSlider {
    -webkit-appearance: none; appearance: none; width: 140px; height: 4px;
    background: #555; border-radius: 2px; outline: none; margin: 0;
  }
  .rangeSlider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: #e25822; cursor: pointer;
  }
  .rangeSlider::-moz-range-thumb {
    width: 14px; height: 14px; border: none; border-radius: 50%; background: #e25822; cursor: pointer;
  }
  .rangeSlider:disabled { opacity: 0.4; cursor: not-allowed; }
  .rangeSlider:disabled::-webkit-slider-thumb { cursor: not-allowed; }

  #continentPanel {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%); z-index: 10;
    background: rgba(20,20,20,0.85); color: #eee; padding: 12px 14px;
    border-radius: 8px; font-size: 13px; display: flex; flex-direction: column; gap: 6px;
  }
  #continentPanel h2 { font-size: 11px; margin: 0 0 4px; text-transform: uppercase; letter-spacing: 0.05em; color: #999; }
  #continentPanel button {
    background: #2a2a2a; color: #eee; border: none; border-radius: 6px;
    padding: 7px 12px; text-align: left; font-size: 13px; cursor: pointer;
  }
  #continentPanel button:hover { background: #e25822; }

  #continentPanel hr { width: 100%; border: none; border-top: 1px solid #444; margin: 4px 0; }
  #countrySearch {
    background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 6px;
    padding: 7px 10px; font-size: 13px; outline: none;
  }
  #countrySearch:focus { border-color: #e25822; }
  #countryResults { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
  #countryResults button {
    background: #2a2a2a; color: #eee; border: none; border-radius: 6px;
    padding: 6px 12px; text-align: left; font-size: 13px; cursor: pointer;
  }
  #countryResults button:hover { background: #e25822; }

  #predictionPanel {
    position: absolute; bottom: 16px; left: 16px; z-index: 10;
    background: rgba(20,20,20,0.9); color: #eee; padding: 12px 16px;
    border-radius: 8px; font-size: 13px; max-width: 320px; display: none;
  }
  #predictionPanel h3 { margin: 0 0 6px; font-size: 13px; color: #ff8a3d; }
  #predictionPanel p { margin: 3px 0; color: #ccc; }
  #predictionPanel button {
    margin-top: 8px; background: #2a2a2a; color: #eee; border: none;
    border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  #predictionPanel button:hover { background: #555; }
</style>
</head>
<body>
<div id="status">Loading fire data...</div>
<div id="optimizePanel">
  <div class="switchRow">
    <span>Prediction</span>
    <label class="switch">
      <input type="checkbox" id="predictionToggle" checked />
      <span class="slider"></span>
    </label>
  </div>
  <div class="switchRow">
    <span>Show small fires</span>
    <label class="switch">
      <input type="checkbox" id="smallFiresToggle" />
      <span class="slider"></span>
    </label>
  </div>
  <div class="sliderRow">
    <div class="rowTop">
      <span>Prediction range</span>
      <span id="predictionDaysLabel">1 day</span>
    </div>
    <input type="range" class="rangeSlider" id="predictionDaysSlider" min="1" max="7" step="1" value="1" />
  </div>
  <div class="sliderRow">
    <div class="rowTop">
      <span>Prediction strength</span>
      <span id="predictionStrengthLabel">1: Basic</span>
    </div>
    <input type="range" class="rangeSlider" id="predictionStrengthSlider" min="1" max="4" step="1" value="1" />
  </div>
  <div class="sliderRow">
    <div class="rowTop">
      <span>Detail level</span>
      <span id="fireCountLabel">Sparse</span>
    </div>
    <input type="range" class="rangeSlider" id="fireCountSlider" min="0" max="6" step="1" value="0" />
  </div>
</div>
<div id="continentPanel">
  <h2>Quick Look</h2>
  <button data-lat="1" data-lng="21" data-alt="1.8">Africa</button>
  <button data-lat="-82" data-lng="0" data-alt="1.8">Antarctica</button>
  <button data-lat="34" data-lng="100" data-alt="1.8">Asia</button>
  <button data-lat="-25" data-lng="133" data-alt="1.8">Australia</button>
  <button data-lat="54" data-lng="15" data-alt="1.8">Europe</button>
  <button data-lat="45" data-lng="-100" data-alt="1.8">North America</button>
  <button data-lat="-15" data-lng="-60" data-alt="1.8">South America</button>
  <hr />
  <input type="text" id="countrySearch" placeholder="Search country..." autocomplete="off" />
  <div id="countryResults"></div>
</div>
<div id="predictionPanel">
  <h3>Fire spread predictions</h3>
  <div id="predictionInfo"></div>
  <button id="clearPredictions">Clear</button>
</div>
<div id="globeViz"></div>

<script src="https://unpkg.com/globe.gl"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<!-- type="module" so the fire-sprite layer can `import` its own three.js
     instance directly, scoped to just this code - NOT window.THREE.
     globe.gl (>=2.46, requires three >=0.179) bundles its own internal
     three.js and never reads window.THREE unless something else set it
     first; defining window.THREE ourselves previously broke globe.gl
     globally because it picked up an incompatible three.js version for its
     OWN rendering instead of its safe internal fallback. Importing three
     as a separate module avoids that entirely: three.js's renderer uses
     duck-typed flags (isPoints/isMesh/isObject3D) rather than instanceof
     checks, so an Object3D built from this module's THREE still works fine
     when added to globe.gl's scene via customThreeObject. -->
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.185.1/build/three.module.js';
const statusEl = document.getElementById('status');

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// Fire severity scale: log-normalized so a handful of very intense fires
// (or clusters) don't wash out everything else at max marker size.
const FRP_SCALE_REF = 150; // MW - combined FRP that reads as "maximum severity"
function intensityT(frp) {
  return clamp(Math.log1p(frp) / Math.log1p(FRP_SCALE_REF), 0, 1);
}

// Severity color: 3 discrete buckets (yellow/orange/red), not a computed
// gradient - cheaper to evaluate per-marker and matches how other fire
// trackers bucket intensity for a quick glance instead of a precise reading.
const SEVERITY_YELLOW = [255, 221, 51];
const SEVERITY_ORANGE = [255, 140, 20];
const SEVERITY_RED = [200, 30, 20];
function severityBucket(t) {
  if (t < 1 / 3) return SEVERITY_YELLOW;
  if (t < 2 / 3) return SEVERITY_ORANGE;
  return SEVERITY_RED;
}

// Dimmed version of a severity color, used for a fire's old position once a
// prediction has been run for it (the new predicted position gets the
// normal, full-brightness marker instead).
const FADE_DARK = 40;
function fadeRgb([r, g, b]) {
  return [lerp(r, FADE_DARK, 0.75), lerp(g, FADE_DARK, 0.75), lerp(b, FADE_DARK, 0.75)];
}

// Fire markers render as a single THREE.Points sprite cloud instead of
// per-marker 3D meshes: one small circular texture, one draw call for every
// marker on screen regardless of count. This replaced a merged-cylinder-mesh
// point layer (already batched to one draw call, but each marker still cost
// dozens of vertices) - a point sprite costs a single vertex, so the win
// scales with marker count. Tradeoff: no built-in hover tooltip (that relied
// on three-globe's mesh raycasting), dropped intentionally - not needed.
function makeCircleSpriteTexture() {
  const size = 64;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const r = size / 2;
  const gradient = ctx.createRadialGradient(r, r, 0, r, r, r);
  gradient.addColorStop(0, 'rgba(255,255,255,1)');
  gradient.addColorStop(0.7, 'rgba(255,255,255,1)');
  gradient.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(r, r, r, 0, Math.PI * 2);
  ctx.fill();
  return new THREE.CanvasTexture(canvas);
}

const FIRE_SPRITE_ALTITUDE = 0.01;
const FIRE_SPRITE_SIZE = 1.5; // world units; tune to taste once seen live

const fireSpritesGeometry = new THREE.BufferGeometry();
const fireSpritesMaterial = new THREE.PointsMaterial({
  map: makeCircleSpriteTexture(),
  size: FIRE_SPRITE_SIZE,
  sizeAttenuation: true,
  vertexColors: true,
  transparent: true,
  alphaTest: 0.05,
  depthWrite: false,
});
const fireSpritesObject = new THREE.Points(fireSpritesGeometry, fireSpritesMaterial);

// Rebuilds the sprite cloud's position/color buffers from the current set of
// markers (fire clusters, optionally mixed with predicted-position markers).
// Replaces every world.pointsData(...) call the old mesh-based layer used.
function updateFireSprites(markers) {
  const positions = new Float32Array(markers.length * 3);
  const colors = new Float32Array(markers.length * 3);
  markers.forEach((d, i) => {
    const coords = world.getCoords(d.lat, d.lng, FIRE_SPRITE_ALTITUDE);
    positions[i * 3] = coords.x;
    positions[i * 3 + 1] = coords.y;
    positions[i * 3 + 2] = coords.z;
    const [r, g, b] = d.faded ? fadeRgb(severityBucket(intensityT(d.totalFrp))) : severityBucket(intensityT(d.totalFrp));
    colors[i * 3] = r / 255;
    colors[i * 3 + 1] = g / 255;
    colors[i * 3 + 2] = b / 255;
  });
  fireSpritesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  fireSpritesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  fireSpritesGeometry.computeBoundingSphere();
}

const world = Globe()
  (document.getElementById('globeViz'))
  .pointOfView({ lat: 20, lng: 0, altitude: 2.2 })
  // Fire markers are NOT a globe.gl points layer - see updateFireSprites()
  // above. A single custom-object datum hosts the whole sprite cloud so
  // it's parented/positioned correctly under the globe, but its buffers are
  // filled and refreshed by updateFireSprites(), not by globe.gl's own
  // per-datum reactive update path.
  .customLayerData([{}])
  .customThreeObject(() => fireSpritesObject)
  .customThreeObjectUpdate(() => {})
  .polygonCapColor(() => 'rgba(0,0,0,0)')
  .polygonSideColor(() => 'rgba(0,0,0,0)')
  .polygonStrokeColor(() => '#000000')
  .polygonAltitude(0.005)
  .polygonLabel(d => d.properties?.name ?? '')
  .arcsData([])
  .arcStartLat(d => d.startLat)
  .arcStartLng(d => d.startLng)
  .arcEndLat(d => d.endLat)
  .arcEndLng(d => d.endLng)
  .arcColor(() => '#ffffff')
  .arcStroke(0.075)
  .arcAltitude(0.008) // fixed, not auto-scaled - these spread distances are short
  // enough (tens to low-hundreds of km) that auto altitude flattened arcs
  // right onto the surface and they z-fought with the globe texture
  .arcsTransitionDuration(0)
  // Multi-point trajectory for prediction strength 2+ (hourly-stepped path,
  // bending as the wind shifts), as opposed to the single straight arc
  // strength 1 uses.
  .pathsData([])
  .pathPoints(d => d.points)
  .pathPointLat(p => p[0])
  .pathPointLng(p => p[1])
  .pathPointAlt(0.008)
  .pathColor(() => '#ffffff')
  // Unlike arcStroke (a globe-relative tube radius), pathStroke is a
  // screen-space pixel width - the two aren't the same unit, so this isn't
  // tuned to match arcStroke's value.
  .pathStroke(1)
  .pathTransitionDuration(0)
  // Country name labels only - a handful of TextGeometry objects (capped,
  // see updateCountryLabels), nothing like the per-fire "!" labels that
  // caused the old zoom-in lag (those rebuilt hundreds of glyphs on every
  // zoom-tier change; this rebuilds at most COUNTRY_LABEL_CAP of them, and
  // only when the visible set actually changes).
  .labelsData([])
  .labelLat(d => d.lat)
  .labelLng(d => d.lng)
  .labelText(d => d.name)
  .labelColor(() => '#ffffff')
  .labelSize(d => d.size)
  .labelDotRadius(0)
  .labelIncludeDot(false)
  .labelResolution(2)
  .labelAltitude(0.005)
  .labelsTransitionDuration(0);

// Exposed for debugging from outside the module (e.g. driving pointOfView
// from a test script) - the app script is type="module" now, so top-level
// bindings like `world` no longer land on window automatically.
window.world = world;

// Groups fires within gridDeg of each other into a single marker, purely to
// reduce visual clutter - the underlying detections are kept (in `.fires`)
// rather than discarded, so nothing about the data is lost, only how
// densely-packed detections are displayed. The grid size scales with camera
// altitude (see gridForAltitude): coarse/few clusters at whole-earth zoom
// where thousands of individual points would be both unreadable and slow to
// render, fine-grained detail once zoomed into a region - the same
// zoom-dependent level-of-detail technique 2D map tools use to stay fast.
function gridForAltitude(altitude) {
  if (altitude > 1.2) return 2.0; // whole-earth view - a handful of regional blobs
  if (altitude > 0.6) return 0.5;
  if (altitude > 0.2) return 0.15;
  if (altitude > 0.05) return 0.05; // country-scale - ~5.5km, used to be the finest tier
  // Below country-scale, clustering keeps getting finer instead of
  // plateauing at 5.5km, so zooming into a searched country keeps revealing
  // more individual fires rather than hitting an invisible ceiling.
  if (altitude > 0.015) return 0.015; // ~1.7km
  return 0.003; // ~330m - close to VIIRS' own ~375m pixel size, i.e. near-individual detections
}

function clusterFires(fires, gridDeg) {
  const groups = new Map();
  fires.forEach(f => {
    const key = `${Math.round(f.lat / gridDeg)},${Math.round(f.lng / gridDeg)}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(f);
  });

  return [...groups.values()].map(group => {
    const totalFrp = group.reduce((sum, f) => sum + f.frp, 0);
    const maxFrp = Math.max(...group.map(f => f.frp));
    // FRP-weighted centroid, so the marker sits nearer the most intense
    // detections rather than a plain geographic average.
    const weight = totalFrp || group.length;
    const lat = group.reduce((sum, f) => sum + f.lat * (f.frp || 1), 0) / weight;
    const lng = group.reduce((sum, f) => sum + f.lng * (f.frp || 1), 0) / weight;
    return { lat, lng, count: group.length, totalFrp, maxFrp, fires: group };
  });
}

let predictionArcs = [];
function updateArcsLayer() {
  world.arcsData(predictionArcs);
}

// Plain white line from each predicted fire's original position to its
// projected one - solid, no dash/animation (dashed arcs weren't rendering
// visibly on this three-globe version, see ideas.txt history). Strength 1
// uses a single straight arc (predictionArcs); strength 2+ uses a bent,
// hourly-stepped multi-point path instead (predictionPaths) - only one of
// the two is populated at a time.
let predictionPaths = [];

let lastRenderedFires = [];
let lastClusters = [];

function renderFireMarkers(fires, altitudeOverride) {
  lastRenderedFires = fires;
  // world.pointOfView().altitude reflects the camera's CURRENT position,
  // which mid-flyTo is some in-between value, not the destination - reading
  // it right after a country search (before the 1s flight finishes) picked
  // the wrong cluster grid size and threw off cluster centroids. Callers
  // that know the real target altitude (e.g. a just-searched country) pass
  // it explicitly instead of relying on a live camera read.
  const altitude = altitudeOverride ?? world.pointOfView().altitude;
  const gridDeg = gridForAltitude(altitude);
  currentZoomTier = gridDeg;
  lastClusters = clusterFires(fires, gridDeg);
  updateFireSprites(lastClusters);
}

// For fires the backend already aggregated (see loadFires' `grid` param) -
// each item already has {lat,lng,count,totalFrp,maxFrp},
// the exact shape clusterFires() would have produced, so there's no
// client-side re-clustering step (skips both that compute cost and having
// to ship every raw detection to the browser just to immediately fold them
// back together).
function renderPreClusteredMarkers(clusters) {
  lastClusters = clusters;
  updateFireSprites(lastClusters);
}

// Re-cluster (not re-fetch) whenever the camera crosses into a different
// zoom tier, so the marker count adapts to what's actually legible/fast at
// the current view without hitting the network again. Zooming around no
// longer clears an active prediction - the re-clustered markers won't carry
// the old faded/predicted state, so if a prediction was showing, it's
// re-run against the fresh clusters instead of just dropped.
let currentZoomTier = null;

// Whether a country search is the active view - country search stays
// authoritative over whatever's rendered while one is active, since
// loadCountryFires already fetched that country's complete fire set.
let inCountryView = false;

// Density/render cost is controlled SOLELY by the Detail level slider now,
// not by camera altitude. An earlier version re-fetched and re-clustered at
// a finer server-side grid the closer you zoomed in ("viewport mode") - in
// testing that made close zoom both slower (near-individual-detection
// cluster counts) and visually worse (clusters snap to a visible grid at
// fine resolutions, looking artificial). Camera zoom is now purely visual:
// the same slider-controlled cluster set stays rendered regardless of how
// close the camera gets, so panning/zooming around the globe never
// triggers a new fetch or a render cost change.

// "Show small fires" toggle: off by default. Below this FRP (MW), a fire is
// a flat intensity floor, not a rank-based cap - a fire either clears
// MIN_FRP_THRESHOLD or it doesn't, regardless of how it compares to fires
// elsewhere, so this doesn't reintroduce the "real regional fire loses out
// to stronger fires on the other side of the world" problem a top-N cap
// caused earlier. ~25th percentile of current worldwide FRP, so it trims
// the weakest quarter of detections (the ones nobody's actually looking
// for) without touching anything a person would call "a real fire."
// Country search intentionally ignores this - that mode exists specifically
// for full detail on a place you've already chosen to drill into.
const MIN_FRP_THRESHOLD = 3;
const smallFiresToggle = document.getElementById('smallFiresToggle');
function currentMinFrp() {
  return smallFiresToggle.checked ? null : MIN_FRP_THRESHOLD;
}

// Reacting to camera movement is polled, not event-driven off
// world.controls()'s 'change' event - that event only fires reliably for
// direct mouse drag/scroll on OrbitControls. world.pointOfView() (used by
// the Quick Look continent buttons and every country-search flyTo) moves
// the camera via three-globe's own tween and does NOT reliably dispatch
// 'change', so anything wired only to that event silently never ran after
// those actions - country labels never updated after a button click unless
// you happened to manually drag/scroll afterward. Polling checks the real
// camera state directly, so it works the same regardless of how the camera
// got there. Each check below is itself cheap/bucket-gated (see
// updateCountryLabels), so polling a few times a second costs effectively
// nothing when nothing's actually changed.
setInterval(() => {
  const pov = world.pointOfView();
  updateCountryLabels(pov.altitude);

  // Re-cluster (not re-fetch) a country view's already-complete local fire
  // set whenever the camera crosses into a different zoom tier - the world
  // view doesn't do this at all now (see the Detail level slider comment).
  if (inCountryView && lastRenderedFires.length > 0) {
    const tier = gridForAltitude(pov.altitude);
    if (tier !== currentZoomTier) {
      currentZoomTier = tier;
      renderFireMarkers(lastRenderedFires);
      if (predictionToggle.checked && lastPredictedCountry) {
        runCountryPredictions(lastPredictedCountry, lastPredictedFires);
      }
    }
  }
}, 250);

// Approximate polygon area (shoelace formula on raw lon/lat) - only used to
// rank ring sizes, not for precise measurement.
function ringArea(ring) {
  let area = 0;
  for (let i = 0; i < ring.length; i++) {
    const [x1, y1] = ring[i];
    const [x2, y2] = ring[(i + 1) % ring.length];
    area += x1 * y2 - x2 * y1;
  }
  return Math.abs(area / 2);
}

// Bounding-box center/extent of a country's MAIN landmass, used to fly the
// camera to it. Countries with far-flung territories (e.g. France with
// French Guiana, the Netherlands, the UK) are MultiPolygons - averaging
// across every part would land the camera in open ocean between them, so
// we only use the largest polygon by area.
function boundsOf(feature) {
  const geom = feature.geometry;
  const polygons = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;

  let mainPolygon = polygons[0];
  let bestArea = ringArea(polygons[0][0]);
  for (let i = 1; i < polygons.length; i++) {
    const a = ringArea(polygons[i][0]);
    if (a > bestArea) { bestArea = a; mainPolygon = polygons[i]; }
  }

  let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
  mainPolygon[0].forEach(([lng, lat]) => {
    if (lat < minLat) minLat = lat;
    if (lat > maxLat) maxLat = lat;
    if (lng < minLng) minLng = lng;
    if (lng > maxLng) maxLng = lng;
  });
  return {
    lat: (minLat + maxLat) / 2,
    lng: (minLng + maxLng) / 2,
    latSpan: maxLat - minLat,
    lngSpan: maxLng - minLng,
    minLat, maxLat, minLng, maxLng,
  };
}

// Standard even-odd ray-casting point-in-polygon test. `ring` is a GeoJSON
// coordinate ring, [[lng,lat], ...].
function pointInRing(lat, lng, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i];
    const [xj, yj] = ring[j];
    const intersects = yi > lat !== yj > lat && lng < ((xj - xi) * (lat - yi)) / (yj - yi) + xi;
    if (intersects) inside = !inside;
  }
  return inside;
}

// Whether (lat, lng) falls inside a country's actual GeoJSON shape (Polygon
// or MultiPolygon, respecting holes) - not just its bounding box. A
// bounding-box fetch alone lets fires from neighboring countries through
// (e.g. France's rectangle overlaps parts of Switzerland/Germany/Italy);
// this is the precise filter applied on top of that fetch.
function pointInCountryGeometry(lat, lng, geometry) {
  const polygons = geometry.type === 'Polygon' ? [geometry.coordinates] : geometry.coordinates;
  for (const polygon of polygons) {
    if (!pointInRing(lat, lng, polygon[0])) continue;
    let inHole = false;
    for (let h = 1; h < polygon.length; h++) {
      if (pointInRing(lat, lng, polygon[h])) { inHole = true; break; }
    }
    if (!inHole) return true;
  }
  return false;
}

// Area-weighted centroid of a ring (standard polygon centroid formula, not
// just an average of its vertices).
function ringCentroid(ring) {
  let area = 0, cx = 0, cy = 0;
  for (let i = 0; i < ring.length; i++) {
    const [x0, y0] = ring[i];
    const [x1, y1] = ring[(i + 1) % ring.length];
    const cross = x0 * y1 - x1 * y0;
    area += cross;
    cx += (x0 + x1) * cross;
    cy += (y0 + y1) * cross;
  }
  area *= 0.5;
  if (Math.abs(area) < 1e-9) {
    const n = ring.length;
    const sum = ring.reduce((acc, [x, y]) => [acc[0] + x, acc[1] + y], [0, 0]);
    return { lng: sum[0] / n, lat: sum[1] / n };
  }
  return { lng: cx / (6 * area), lat: cy / (6 * area) };
}

// Where to actually draw a country's name label. The bounding-box center
// (used for camera flyTo) is wrong for this - it's the midpoint of the
// country's extent, not a point inside its shape, so anything concave or
// crescent-shaped (Norway, Chile, Vietnam, Croatia...) gets a label that
// lands in the ocean or in a neighboring country. The polygon centroid is
// usually inside the shape, but not always for the same reason - so this
// falls back to scanning a grid across the main polygon's bounding box for
// the point closest to that centroid that's actually inside the country.
function labelPointFor(feature) {
  const geom = feature.geometry;
  const polygons = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;

  let mainPolygon = polygons[0];
  let bestArea = ringArea(polygons[0][0]);
  for (let i = 1; i < polygons.length; i++) {
    const a = ringArea(polygons[i][0]);
    if (a > bestArea) { bestArea = a; mainPolygon = polygons[i]; }
  }

  const outerRing = mainPolygon[0];
  const centroid = ringCentroid(outerRing);
  if (pointInCountryGeometry(centroid.lat, centroid.lng, geom)) return centroid;

  let minLng = 180, maxLng = -180, minLat = 90, maxLat = -90;
  outerRing.forEach(([lng, lat]) => {
    if (lng < minLng) minLng = lng;
    if (lng > maxLng) maxLng = lng;
    if (lat < minLat) minLat = lat;
    if (lat > maxLat) maxLat = lat;
  });

  let best = null;
  let bestDist = Infinity;
  const STEPS = 20;
  for (let i = 0; i <= STEPS; i++) {
    for (let j = 0; j <= STEPS; j++) {
      const lng = minLng + ((maxLng - minLng) * i) / STEPS;
      const lat = minLat + ((maxLat - minLat) * j) / STEPS;
      if (!pointInCountryGeometry(lat, lng, geom)) continue;
      const d = (lng - centroid.lng) ** 2 + (lat - centroid.lat) ** 2;
      if (d < bestDist) { bestDist = d; best = { lat, lng }; }
    }
  }
  return best ?? { lat: (minLat + maxLat) / 2, lng: (minLng + maxLng) / 2 };
}

let COUNTRY_LIST = [];
const countrySearch = document.getElementById('countrySearch');
const countryResults = document.getElementById('countryResults');

async function loadCountryBorders() {
  const topo = await (await fetch('https://unpkg.com/world-atlas@2/countries-110m.json')).json();
  const countries = topojson.feature(topo, topo.objects.countries).features
    .filter(f => f.properties?.name && f.properties.name !== 'Antarctica');
  world.polygonsData(countries);

  COUNTRY_LIST = countries.map(f => {
    const b = boundsOf(f);
    // pad the bbox a bit so fires just across a border/coastline aren't missed
    // by the initial fetch - the precise polygon filter below still excludes
    // them from the final result if they're genuinely outside the country.
    const pad = 0.75;
    const labelPoint = labelPointFor(f);
    return {
      name: f.properties.name,
      lat: b.lat,
      lng: b.lng,
      labelLat: labelPoint.lat,
      labelLng: labelPoint.lng,
      altitude: clamp(Math.max(b.latSpan, b.lngSpan) / 60, 0.25, 2.2),
      minLat: clamp(b.minLat - pad, -90, 90),
      maxLat: clamp(b.maxLat + pad, -90, 90),
      minLng: clamp(b.minLng - pad, -180, 180),
      maxLng: clamp(b.maxLng + pad, -180, 180),
      geometry: f.geometry,
    };
  });
  updateCountryLabels(world.pointOfView().altitude);
}
loadCountryBorders();

// A country's name appears once the camera is within LABEL_VISIBILITY_FACTOR
// times its own "natural framing altitude" (the same c.altitude used to fly
// to it on search) - large countries (large latSpan/lngSpan -> large
// altitude) qualify from far away, small ones only once zoomed in close.
// That's a cheap stand-in for "does it actually fit on screen" without real
// text measurement. That check alone isn't enough though: it only looks at
// zoom level, not WHERE the camera is pointed, so zooming in tight on one
// small country still left it competing for the label cap against every
// other small country on Earth that also technically "qualifies" at that
// zoom level. So this also filters to countries within roughly the current
// viewport, using the camera's look-at point. Gated on a coarse altitude +
// look-at bucket so it only rebuilds the label set on a meaningful camera
// change, not every frame of a drag.
const LABEL_VISIBILITY_FACTOR = 4;
const COUNTRY_LABEL_CAP = 60; // safety cap; keeps the largest/most prominent nearby countries if more would qualify
let lastLabelKey = null;

function updateCountryLabels(altitude) {
  const pov = world.pointOfView();
  const key = `${Math.round(altitude * 20)}|${Math.round(pov.lat / 2)}|${Math.round(pov.lng / 2)}`;
  if (key === lastLabelKey) return;
  lastLabelKey = key;

  // Rough angular radius of what's currently on screen - shrinks with
  // altitude, same way the actual visible slice of globe does. A plain
  // degrees-of-lat/lng distance (not true great-circle) is plenty precise
  // for "is this roughly in view," and a country's own size is added as
  // slack so a large country's label doesn't vanish just because its
  // centroid sits slightly outside the strict radius while the country
  // itself still spans into view.
  const visibleRadiusDeg = clamp(altitude * 90, 6, 180);

  const visible = COUNTRY_LIST
    .filter(c => altitude <= c.altitude * LABEL_VISIBILITY_FACTOR)
    .filter(c => {
      const dLat = pov.lat - c.lat;
      const dLng = pov.lng - c.lng;
      return Math.sqrt(dLat * dLat + dLng * dLng) <= visibleRadiusDeg + c.altitude * 60;
    })
    .sort((a, b) => b.altitude - a.altitude)
    .slice(0, COUNTRY_LABEL_CAP)
    .map(c => ({
      lat: c.labelLat,
      lng: c.labelLng,
      name: c.name,
      // Labels are 3D billboards anchored to the globe surface, so getting
      // closer already makes them look bigger on screen via perspective -
      // this needs to shrink WITH altitude (not against it) or a label
      // balloons to fill the screen once zoomed into a small country.
      size: clamp(altitude * 0.9, 0.18, 1.0),
    }));

  world.labelsData(visible);
}

function renderCountryResults(query) {
  countryResults.innerHTML = '';
  if (!query) return;
  const q = query.toLowerCase();
  COUNTRY_LIST
    .filter(c => c.name.toLowerCase().startsWith(q))
    .sort((a, b) => a.name.localeCompare(b.name))
    .forEach(c => {
      const btn = document.createElement('button');
      btn.textContent = c.name;
      btn.addEventListener('click', async () => {
        world.pointOfView({ lat: c.lat, lng: c.lng, altitude: c.altitude }, 1000);
        const fires = await loadCountryFires(c);
        if (predictionToggle.checked) {
          runCountryPredictions(c, fires);
        }
      });
      countryResults.appendChild(btn);
    });
}

countrySearch.addEventListener('input', () => {
  const query = countrySearch.value.trim();
  renderCountryResults(query);
  if (!query) {
    // Back to the current world-wide "Fires shown" setting rather than
    // staying stuck on whatever country was last searched.
    lastPredictedCountry = null;
    lastPredictedFires = null;
    inCountryView = false;
    loadFires();
  }
});

// --- Fire spread predictions: projected location N days out (gated by the Prediction toggle, run on country search) ---
const predictionToggle = document.getElementById('predictionToggle');
const predictionPanel = document.getElementById('predictionPanel');
const predictionInfo = document.getElementById('predictionInfo');
const clearPredictionsBtn = document.getElementById('clearPredictions');
const predictionDaysSlider = document.getElementById('predictionDaysSlider');
const predictionDaysLabel = document.getElementById('predictionDaysLabel');
const predictionStrengthSlider = document.getElementById('predictionStrengthSlider');
const predictionStrengthLabel = document.getElementById('predictionStrengthLabel');
const MAX_PREDICTIONS = 150; // safety cap for pathological cases; take the most intense first
const WIND_GRID_DEG = 0.3; // wind is shared across markers within this grid cell (~30km) to limit API calls

function predictionHours() {
  return (+predictionDaysSlider.value) * 24;
}

// How much goes into the spread model, from a quick current-wind snapshot
// up to hourly wind + terrain + humidity. Each tier costs more requests, so
// it's opt-in rather than always running at full strength.
const PREDICTION_STRENGTH_LABELS = {
  1: '1: Basic',
  2: '2: Hourly wind',
  3: '3: +Terrain',
  4: '4: Max accuracy',
};
function predictionStrength() {
  return +predictionStrengthSlider.value;
}

// Tracks the most recent successful prediction run, so changing the day/
// strength slider can re-run it at the new setting instead of just changing
// a number nothing looks at.
let lastPredictedCountry = null;
let lastPredictedFires = null;

predictionDaysSlider.addEventListener('input', () => {
  const days = +predictionDaysSlider.value;
  predictionDaysLabel.textContent = days === 1 ? '1 day' : `${days} days`;
});
predictionDaysSlider.addEventListener('change', () => {
  if (predictionToggle.checked && lastPredictedCountry) {
    runCountryPredictions(lastPredictedCountry, lastPredictedFires);
  }
});
predictionStrengthSlider.addEventListener('input', () => {
  predictionStrengthLabel.textContent = PREDICTION_STRENGTH_LABELS[predictionStrength()];
});
predictionStrengthSlider.addEventListener('change', () => {
  if (predictionToggle.checked && lastPredictedCountry) {
    runCountryPredictions(lastPredictedCountry, lastPredictedFires);
  }
});

// Fetches the accurate, full fire set for a country's bbox (the initial world
// view holds every fire, but pre-clustered at a coarse grid for render speed -
// see the detail-level slider - so individual small fires in a given country
// are merged into their cluster rather than shown separately). Renders ONLY
// this country's fires, replacing whatever was shown
// before - merging into the accumulated world dataset used to mean a search
// after "Show all fires" reclustered and predicted on the entire world's
// fires at the country's fine zoom grid (slow, and predictions landed
// wherever the globally most intense fires happened to be, not in the
// searched country).
async function loadCountryFires(country) {
  inCountryView = true;
  statusEl.textContent = `Loading fires for ${country.name}...`;
  const bbox = [country.minLng, country.minLat, country.maxLng, country.maxLat].join(',');
  try {
    const res = await fetch('/api/fires?bbox=' + encodeURIComponent(bbox));
    const json = await res.json();
    if (!res.ok) throw new Error(json.detail || 'Failed to load fires');

    // The bbox fetch is a rectangle around the country's shape, so it also
    // pulls in fires from neighboring countries that fall inside that
    // rectangle but outside the country itself - filter against the actual
    // polygon to keep only fires genuinely within its borders.
    const fires = json.fires.filter(f => pointInCountryGeometry(f.lat, f.lng, country.geometry));

    // A genuinely new country's fires, not just a re-cluster of the same
    // data (that's the zoom case, which now preserves predictions instead)
    // - any prediction from a previously-searched country is stale here.
    lastPredictedCountry = null;
    lastPredictedFires = null;
    clearPredictions();

    renderFireMarkers(fires, country.altitude);
    statusEl.textContent = `${fires.length} active fire detections in ${country.name}`;
    return fires;
  } catch (err) {
    statusEl.textContent = 'Error loading fires: ' + err.message;
    return [];
  }
}

// Great-circle destination point, `distanceKm` from (lat, lng) along
// bearingDeg (0=N, 90=E).
function destinationPoint(lat, lng, bearingDeg, distanceKm) {
  const R = 6371;
  const bearing = (bearingDeg * Math.PI) / 180;
  const lat1 = (lat * Math.PI) / 180;
  const lng1 = (lng * Math.PI) / 180;
  const dR = distanceKm / R;
  const lat2 = Math.asin(Math.sin(lat1) * Math.cos(dR) + Math.cos(lat1) * Math.sin(dR) * Math.cos(bearing));
  const lng2 = lng1 + Math.atan2(
    Math.sin(bearing) * Math.sin(dR) * Math.cos(lat1),
    Math.cos(dR) - Math.sin(lat1) * Math.sin(lat2)
  );
  return { lat: (lat2 * 180) / Math.PI, lng: (((lng2 * 180) / Math.PI + 540) % 360) - 180 };
}

// Simplified heuristic: spread distance scales with wind speed and fire
// intensity (FRP), projected over the chosen number of hours. Not a
// physical simulation - a demo-grade approximation.
function spreadDistanceKm(windSpeedKmh, frp, hours) {
  const intensityFactor = Math.min(2.0, 0.5 + Math.log1p(frp) / 5);
  return (0.15 * windSpeedKmh + 0.3) * intensityFactor * (hours / 6);
}

// Circular-mean blend from bearing a toward bearing b by fraction w (0 =
// pure a, 1 = pure b) - a plain weighted average breaks down near the
// 0/360 wraparound, so this blends unit vectors instead.
function blendBearing(aDeg, bDeg, w) {
  const aRad = (aDeg * Math.PI) / 180;
  const bRad = (bDeg * Math.PI) / 180;
  const x = (1 - w) * Math.sin(aRad) + w * Math.sin(bRad);
  const y = (1 - w) * Math.cos(aRad) + w * Math.cos(bRad);
  return ((Math.atan2(x, y) * 180) / Math.PI + 360) % 360;
}

// FIRMS confidence ('l'/'n'/'h' for VIIRS) as a 0-1 trust weight - a "low"
// confidence detection is more likely to be noise (sun glint, small
// agricultural burn) than a sustained wildfire, so it shouldn't drive as
// large a projected spread as a "high" confidence one.
function confidenceWeight(fire) {
  const conf = (fire.confidence || '').toString().toLowerCase();
  if (conf === 'h' || conf === 'high') return 1.0;
  if (conf === 'l' || conf === 'low') return 0.6;
  return 0.85; // nominal, or a source that doesn't report confidence
}

// FRP-weighted average confidence across a cluster's raw detections, as a
// single per-cluster multiplier on predicted spread distance.
function clusterConfidenceFactor(cluster) {
  if (!cluster.fires || cluster.fires.length === 0) return 1;
  let weightedSum = 0;
  let totalFrp = 0;
  cluster.fires.forEach(f => {
    const frp = f.frp || 1;
    weightedSum += confidenceWeight(f) * frp;
    totalFrp += frp;
  });
  return totalFrp > 0 ? weightedSum / totalFrp : 1;
}

function clearPredictions() {
  predictionArcs = [];
  updateArcsLayer();
  predictionPaths = [];
  world.pathsData(predictionPaths);
  lastClusters.forEach(c => { c.faded = false; });
  updateFireSprites(lastClusters);
  predictionPanel.style.display = 'none';
}

// Fetches elevation for `points` (grouped in fixed-size chunks of `perGroup`
// points each, `groupsPerChunk` groups per request) sequentially, so a
// single elevation request never exceeds Open-Meteo's ~100-point limit.
// Failed chunks fall back to nulls (matched positionally) rather than
// aborting the whole prediction.
async function fetchElevationInChunks(points, perGroup, groupsPerChunk) {
  const results = [];
  const chunkSize = perGroup * groupsPerChunk;
  for (let i = 0; i < points.length; i += chunkSize) {
    const chunk = points.slice(i, i + chunkSize);
    if (chunk.length === 0) continue;
    const res = await fetch('/api/elevation/batch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(chunk),
    });
    if (res.ok) {
      const json = await res.json();
      results.push(...json.results);
    } else {
      results.push(...chunk.map(() => null));
    }
  }
  return results;
}

function makePredictedMarker(c, dest, hours, windSpeedKmh) {
  return {
    lat: dest.lat,
    lng: dest.lng,
    count: c.count,
    totalFrp: c.totalFrp,
    maxFrp: c.maxFrp,
    fires: c.fires,
    predicted: true,
    predictionHours: hours,
    windSpeedKmh,
  };
}

async function runCountryPredictions(country, fires) {
  lastPredictedCountry = country;
  lastPredictedFires = fires;
  const hours = predictionHours();
  const strength = predictionStrength();

  clearPredictions();
  predictionPanel.style.display = 'block';

  if (fires.length === 0) {
    predictionInfo.innerHTML = `<p>No active fires detected in ${country.name}.</p>`;
    return;
  }

  // Predict per currently-displayed marker (cluster), not per raw detection -
  // that's what's actually visible on screen, and keeps the prediction count
  // bounded even for a country with hundreds of individual fire detections.
  const targets = lastClusters
    .slice()
    .sort((a, b) => b.totalFrp - a.totalFrp)
    .slice(0, MAX_PREDICTIONS);

  predictionInfo.innerHTML = `<p>Projecting ${hours}hr fire locations for ${targets.length} marker(s) in ${country.name}...</p>`;

  // Wind barely varies over ~30km, so markers are grouped onto a coarse grid
  // and share one wind lookup per cell. All cells are fetched in a single
  // request (Open-Meteo supports comma-separated lat/lng lists natively) -
  // firing one request per cell, even in parallel, was the main source of
  // the slowness for a country with many visible markers.
  const cellOf = c => `${Math.round(c.lat / WIND_GRID_DEG)},${Math.round(c.lng / WIND_GRID_DEG)}`;
  const cellCenters = new Map();
  targets.forEach(c => {
    const key = cellOf(c);
    if (!cellCenters.has(key)) cellCenters.set(key, c);
  });
  const cellEntries = [...cellCenters.entries()];

  const predictedMarkers = [];
  const newArcs = [];
  const newPaths = [];

  if (strength === 1) {
    // Stage 1: one current-conditions wind snapshot, straight projection -
    // the original model.
    const windByCell = new Map();
    if (cellEntries.length > 0) {
      const res = await fetch('/api/wind/batch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cellEntries.map(([, c]) => ({ lat: c.lat, lng: c.lng }))),
      });
      if (res.ok) {
        const json = await res.json();
        json.results.forEach((wind, i) => windByCell.set(cellEntries[i][0], wind));
      }
    }

    targets.forEach(c => {
      const wind = windByCell.get(cellOf(c));
      if (!wind) return;
      const distanceKm = spreadDistanceKm(wind.wind_speed_kmh, c.totalFrp, hours);
      const dest = destinationPoint(c.lat, c.lng, wind.wind_blowing_toward_deg, distanceKm);

      c.faded = true; // dim the fire's current position in place
      predictedMarkers.push(makePredictedMarker(c, dest, hours, wind.wind_speed_kmh));
      newArcs.push({ startLat: c.lat, startLng: c.lng, endLat: dest.lat, endLng: dest.lng, color: '#ffffff', animated: false });
    });

    predictionArcs = newArcs;
    updateArcsLayer();
  } else {
    // Stage 2+: hourly wind forecast instead of one static snapshot, stepped
    // every 6 hours so the path bends as the wind shifts over the window.
    const forecastByCell = new Map();
    if (cellEntries.length > 0) {
      const res = await fetch('/api/wind/forecast/batch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ points: cellEntries.map(([, c]) => ({ lat: c.lat, lng: c.lng })), hours }),
      });
      if (res.ok) {
        const json = await res.json();
        json.results.forEach((f, i) => forecastByCell.set(cellEntries[i][0], f.steps));
      }
    }

    // Stage 3: one elevation-based slope multiplier per WIND CELL (not per
    // marker - same coarse grid as the wind lookup), from a probe point 10km
    // along the FIRST step's wind direction - cheap (one extra point per
    // cell), but that also means it goes a bit stale over a multi-day
    // window if the wind rotates. Stage 4 replaces this with a proper
    // gradient (see below) that doesn't have that problem; this cheaper
    // version stays as the "moderate" tier.
    const slopeFactorByCell = new Map();
    if (strength === 3) {
      const probePoints = [];
      const probeCellKeys = [];
      cellEntries.forEach(([key, c]) => {
        const steps = forecastByCell.get(key);
        if (!steps || steps.length === 0) return;
        const probe = destinationPoint(c.lat, c.lng, steps[0].wind_blowing_toward_deg, 10);
        probePoints.push({ lat: c.lat, lng: c.lng }, { lat: probe.lat, lng: probe.lng });
        probeCellKeys.push(key);
      });
      // Open-Meteo's elevation endpoint 400s past ~100 points in one request,
      // and a country with many spread-out fire clusters easily has more
      // cells than that (each cell contributes 2 points) - so this goes out
      // in chunks of 40 pairs (80 points) rather than one big request.
      const ELEVATION_CHUNK_CELLS = 40;
      const elevationResults = await fetchElevationInChunks(probePoints, 2, ELEVATION_CHUNK_CELLS);
      probeCellKeys.forEach((key, i) => {
        const origin = elevationResults[i * 2];
        const probe = elevationResults[i * 2 + 1];
        if (!origin || !probe) return;
        // Percent grade over the 10km probe distance; +3% spread speed per
        // 1% upslope grade, clamped so a cliff doesn't produce a silly
        // multiplier - fire spreads faster uphill (preheats fuel above it)
        // and slower downhill, which is the one piece of real fire behavior
        // this heuristic tries to capture.
        const gradePct = ((probe.elevation_m - origin.elevation_m) / 10000) * 100;
        slopeFactorByCell.set(key, Math.min(1.8, Math.max(0.5, 1 + gradePct * 0.03)));
      });
    }

    // Stage 4 ("most accurate"): every signal we already pull that's
    // actually worth using, per wind cell / per cluster so it stays cheap
    // even though it's the most thorough tier:
    //  - a true 2D elevation gradient (5 probes: origin + N/E/S/W at 10km)
    //    instead of stage 3's single wind-aligned probe, so slope keeps
    //    making sense at hour 150 even after the wind has rotated away from
    //    its hour-0 direction, and can also nudge the travel BEARING toward
    //    true upslope, not just scale distance
    //  - precipitation, which realistically suppresses spread far more than
    //    humidity alone
    //  - temperature, combined with humidity (hot+dry spreads faster than
    //    either factor alone implies)
    //  - FIRMS detection confidence, so a cluster built from shaky/low-
    //    confidence detections doesn't project as aggressively as one built
    //    from confirmed high-confidence fire pixels
    const gradientByCell = new Map();
    if (strength >= 4) {
      const probePoints = [];
      const probeCellKeys = [];
      cellEntries.forEach(([key, c]) => {
        const steps = forecastByCell.get(key);
        if (!steps || steps.length === 0) return;
        const north = destinationPoint(c.lat, c.lng, 0, 10);
        const east = destinationPoint(c.lat, c.lng, 90, 10);
        const south = destinationPoint(c.lat, c.lng, 180, 10);
        const west = destinationPoint(c.lat, c.lng, 270, 10);
        probePoints.push(
          { lat: c.lat, lng: c.lng },
          { lat: north.lat, lng: north.lng },
          { lat: east.lat, lng: east.lng },
          { lat: south.lat, lng: south.lng },
          { lat: west.lat, lng: west.lng },
        );
        probeCellKeys.push(key);
      });
      // 5 points/cell instead of stage 3's 2, so the chunk size drops to
      // keep each request around the same ~80-point budget.
      const ELEVATION_CHUNK_CELLS = 16;
      const elevationResults = await fetchElevationInChunks(probePoints, 5, ELEVATION_CHUNK_CELLS);
      probeCellKeys.forEach((key, i) => {
        const base = i * 5;
        const [origin, north, east, south, west] = elevationResults.slice(base, base + 5);
        if (!origin || !north || !east || !south || !west) return;
        // Central-difference gradient: meters of rise per km, in the north
        // and east directions separately, over the 20km north-south /
        // east-west span between probes.
        const gradNorth = (north.elevation_m - south.elevation_m) / 20;
        const gradEast = (east.elevation_m - west.elevation_m) / 20;
        gradientByCell.set(key, { gradNorth, gradEast });
      });
    }

    targets.forEach(c => {
      const steps = forecastByCell.get(cellOf(c));
      if (!steps || steps.length === 0) return;
      const cellKey = cellOf(c);
      const flatSlopeFactor = strength === 3 ? (slopeFactorByCell.get(cellKey) ?? 1) : 1;
      const gradient = strength >= 4 ? gradientByCell.get(cellKey) : null;
      const confidenceFactor = strength >= 4 ? clusterConfidenceFactor(c) : 1;

      let lat = c.lat;
      let lng = c.lng;
      let lastWindSpeed = steps[0].wind_speed_kmh;
      const points = [[lat, lng]];

      steps.forEach((step, i) => {
        const nextHour = i + 1 < steps.length ? steps[i + 1].hours_from_now : hours;
        const stepHours = Math.min(nextHour, hours) - step.hours_from_now;
        if (stepHours <= 0) return;

        let travelBearing = step.wind_blowing_toward_deg;
        let slopeFactor = flatSlopeFactor;

        if (gradient) {
          // Project the gradient onto THIS step's actual wind bearing
          // (unlike stage 3's one-shot probe, this stays correct as wind
          // rotates hour to hour) to get % grade in the direction of travel.
          const windRad = (travelBearing * Math.PI) / 180;
          const gradAlongWind = gradient.gradNorth * Math.cos(windRad) + gradient.gradEast * Math.sin(windRad);
          const gradePct = gradAlongWind / 10; // m rise per km -> % grade
          slopeFactor = Math.min(1.8, Math.max(0.5, 1 + gradePct * 0.03));

          // Bend the travel direction slightly toward true upslope - capped
          // so wind still dominates overall, this is a nudge not a
          // replacement for wind-driven spread.
          const steepness = Math.hypot(gradient.gradNorth, gradient.gradEast); // m per km
          const upslopeBearing = ((Math.atan2(gradient.gradEast, gradient.gradNorth) * 180) / Math.PI + 360) % 360;
          const blendWeight = Math.min(0.35, steepness * 0.004);
          travelBearing = blendBearing(travelBearing, upslopeBearing, blendWeight);
        }

        // Stage 4: humidity + temperature (combined the way real fire-
        // weather indices do - hot+dry spreads faster than either implies
        // alone) and precipitation, which realistically suppresses spread
        // far more than humidity by itself.
        const humidityFactor = strength >= 4
          ? Math.min(1.3, Math.max(0.5, 1.4 - step.humidity_pct / 100))
          : 1;
        const temperatureFactor = strength >= 4
          ? Math.min(1.3, Math.max(0.7, 0.85 + (step.temperature_c - 20) * 0.015))
          : 1;
        const precipFactor = strength >= 4
          ? Math.min(1, Math.max(0.15, 1 - step.precipitation_mm * 0.5))
          : 1;

        const distanceKm = spreadDistanceKm(step.wind_speed_kmh, c.totalFrp, stepHours)
          * slopeFactor * humidityFactor * temperatureFactor * precipFactor * confidenceFactor;
        const dest = destinationPoint(lat, lng, travelBearing, distanceKm);
        lat = dest.lat;
        lng = dest.lng;
        lastWindSpeed = step.wind_speed_kmh;
        points.push([lat, lng]);
      });

      c.faded = true; // dim the fire's current position in place
      predictedMarkers.push(makePredictedMarker(c, { lat, lng }, hours, lastWindSpeed));
      newPaths.push({ points });
    });

    world.pathsData(newPaths);
    predictionPaths = newPaths;
  }

  updateFireSprites([...lastClusters, ...predictedMarkers]);

  const projectedCount = strength === 1 ? newArcs.length : newPaths.length;
  predictionInfo.innerHTML = `
    <p>${country.name}: ${fires.length} active fire(s) detected</p>
    <p>Projected ${hours}hr position for ${projectedCount} of ${targets.length} marker(s)</p>
  `;
}

clearPredictionsBtn.addEventListener('click', () => {
  lastPredictedCountry = null;
  lastPredictedFires = null;
  clearPredictions();
});

predictionToggle.addEventListener('change', () => {
  if (!predictionToggle.checked) {
    lastPredictedCountry = null;
    lastPredictedFires = null;
    clearPredictions();
  }
});

// Satellite/day imagery, not night-lights - closer to how other fire
// trackers (e.g. FireMap.live) present the globe, and it's genuinely more
// useful here since it shows the actual terrain/vegetation a fire is
// burning through, not just city lights.
world
  .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
  .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
  .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
  .showAtmosphere(true);

document.querySelectorAll('#continentPanel button').forEach(btn => {
  btn.addEventListener('click', () => {
    world.pointOfView(
      { lat: parseFloat(btn.dataset.lat), lng: parseFloat(btn.dataset.lng), altitude: parseFloat(btn.dataset.alt) },
      1000
    );
  });
});

// Every fire worldwide is included - nothing is capped/dropped by rank. The
// slider instead controls how coarse the server-side clustering grid is:
// coarser grids merge more fires per marker, which is cheap to compute and
// cheap to render at a zoomed-out view. Every fire still contributes to its
// cluster's totals (see _cluster_fires in main.py), so this never hides a
// region the way a top-N-by-intensity cap would. The only fires excluded
// are ones below MIN_FRP_THRESHOLD, and only when "Show small fires" is off
// - a flat intensity floor applied equally everywhere, not a competition.
const DETAIL_GRID_STEPS = [3.0, 1.5, 1.0, 0.5, 0.3, 0.2, 0.1];
const FIRE_COUNT_LABELS = ['Sparse', 'Coarse', 'Medium', 'Fine', 'Finer', 'Finest', 'Max'];
const fireCountSlider = document.getElementById('fireCountSlider');
const fireCountLabel = document.getElementById('fireCountLabel');

async function loadFires() {
  const gridDeg = DETAIL_GRID_STEPS[+fireCountSlider.value];
  const minFrp = currentMinFrp();
  const minFrpParam = minFrp !== null ? `&min_frp=${minFrp}` : '';
  statusEl.textContent = 'Loading fire data...';
  try {
    const res = await fetch(`/api/fires?grid=${gridDeg}${minFrpParam}`);
    const json = await res.json();
    if (!res.ok) throw new Error(json.detail || 'Failed to load fires');
    renderPreClusteredMarkers(json.fires);
    statusEl.textContent = `${json.raw_count} active fire detections worldwide`;
  } catch (err) {
    statusEl.textContent = 'Error loading fires: ' + err.message;
    console.error(err);
  }
}

fireCountSlider.addEventListener('input', () => {
  fireCountLabel.textContent = FIRE_COUNT_LABELS[+fireCountSlider.value];
});
fireCountSlider.addEventListener('change', loadFires);

smallFiresToggle.addEventListener('change', () => {
  if (inCountryView) return; // country search always shows full detail
  loadFires();
});

loadFires();
</script>
